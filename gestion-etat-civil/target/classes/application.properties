# Pilote JDBC MySQL
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver

# URL de connexion à la base
hibernate.connection.url=jdbc:mysql://localhost:3306/gestion_etat_civil?useSSL=false&serverTimezone=UTC

# Identifiants MySQL : à adapter à ton installation
hibernate.connection.username=root
hibernate.connection.password=

# Dialecte MySQL pour Hibernate 5.6
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Création ou mise à jour automatique des tables
hibernate.hbm2ddl.auto=update

# Afficher les requêtes SQL
hibernate.show_sql=true
hibernate.format_sql=true
