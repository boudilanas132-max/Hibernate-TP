# Connexion à la base de données MySQL
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/gestion_projets?useSSL=false&serverTimezone=UTC
hibernate.connection.username=root
hibernate.connection.password=

# Dialecte SQL utilisé par Hibernate
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Création ou mise à jour des tables selon les entités
hibernate.hbm2ddl.auto=update

# Affichage des requêtes SQL dans la console
hibernate.show_sql=true
hibernate.format_sql=true
